name: test

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Secret and artifact guard
        run: |
          ! git grep -nE 'github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!tests/**' ':!tools/check-service-account.html'
          test -f .gitignore
          test -f .vercelignore
          test -f .env.example
      - name: Compile
        run: python -m compileall -q app.py api scout tools tests
      - name: Test
        run: python -m pytest -q
